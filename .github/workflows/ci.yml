name: Contract and Rust checks
on: [push, pull_request, workflow_dispatch]
jobs:
  contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p ygo-engine-adapter --examples --locked
      - shell: pwsh
        run: |
          python -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONPATH='python'
          New-Item -ItemType Directory -Force -Path target/pytest-cache | Out-Null
          $testFiles = @(Get-ChildItem -LiteralPath tests -File -Filter 'test_*.py' | Sort-Object Name | ForEach-Object { $_.FullName })
          if ($testFiles.Count -eq 0) { throw 'No Python tests found' }
          python -m pytest -ra @testFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ygo_data.cli validate --input tests/fixtures/cards.sample.json
