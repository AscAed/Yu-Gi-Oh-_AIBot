[workspace]
members = [
    "crates/ygo-domain",
    "crates/ygo-engine-adapter",
    "crates/ygo-search",
    "crates/ygo-storage",
    "crates/ygo-api",
    "crates/ygo-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
