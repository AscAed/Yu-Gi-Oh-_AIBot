[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ygo-aibot-tools"
version = "0.1.0"
description = "Data import and offline evaluation tools for Yu-Gi-Oh! OCG AI"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["jsonschema>=4.23,<5"]

[project.scripts]
ygo-data = "ygo_data.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
